<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios: Variables y Constantes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #1e1e1e; color: #fff; }
        #sidebar { width: 340px; background: #252526; border-right: 1px solid #3c3c3c; padding: 15px; overflow-y: auto; }
        .item { padding: 10px; margin-bottom: 6px; background: #2d2d2d; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .item:hover, .item.active { background: #007acc; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #bar { height: 45px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        #btn { background: #28a745; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        #instruccion-container { background: #2d2d2d; padding: 12px 15px; border-bottom: 1px solid #3c3c3c; font-size: 14px; color: #d4d4d4; }
        #instruccion-container strong { color: #4ec9b0; }

        #editor { flex: 2; }
        #output { flex: 1; background: #111; padding: 15px; border-top: 2px solid #3c3c3c; overflow-y: auto; font-family: monospace; }
        .ia-box { background: #3b1818; border-left: 4px solid #f44336; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; white-space: pre-line; }
        .alerta-box { background: #4a3b00; border-left: 4px solid #ffc107; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #fff3cd; }
        .exito-box { background: #1b381e; border-left: 4px solid #28a745; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #d4edda; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="sidebar">
        <h3 style="margin-bottom:10px; color:#4ec9b0;">Módulo 1: Variables y Constantes (30)</h3>
        <div id="lista"></div>
    </div>
    <div id="main">
        <div id="bar">
            <span id="title" style="font-weight:bold;"></span>
            <button id="btn" onclick="ejecutar()">▶ Ejecutar Algoritmo</button>
        </div>
        
        <div id="instruccion-container">
            <strong>Instrucción:</strong> <span id="texto-instruccion">Selecciona un ejercicio</span>
        </div>

        <div id="editor"></div>
        <div id="output">
            <strong>Consola:</strong>
            <pre id="consola" style="color:#aaa; margin-top:5px;"></pre>
            <div id="ia"></div>
        </div>
    </div>

    <script>
        const ejercicios = [
            { id: 1, t: "1. Tu Primera Variable", instr: "Crea una variable llamada 'mensaje' que almacene el texto \"¡Hola, Python!\" y muéstrala usando print().", code: "# Escribe tu código aquí abajo:\n" },
            { id: 2, t: "2. Variable de Texto", instr: "Crea una variable llamada 'nombre' con tu nombre entre comillas e imprímela.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 3, t: "3. Variable Numérica", instr: "Declara una variable 'edad' con un número entero y muéstrala en consola.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 4, t: "4. Variable Decimal (Float)", instr: "Crea una variable llamada 'precio' con el valor decimal 19.99 e imprímela.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 5, t: "5. Variable Booleana", instr: "Crea una variable booleana llamada 'activo' con valor True y muéstrala.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 6, t: "6. Suma de Variables", instr: "Crea dos variables a = 10 y b = 20, súmalas en una tercera variable 'suma' e imprímela.", code: "a = 10\nb = 20\n\n# Escribe tu código aquí abajo:\n" },
            { id: 7, t: "7. Reasignación de Valor", instr: "Crea una variable 'puntos' con valor 50, luego cámbiala a 100 y muestra el resultado final.", code: "puntos = 50\n\n# Escribe tu código aquí abajo:\n" },
            { id: 8, t: "8. Constantes por Convención", instr: "Crea una constante llamada 'PI' con valor 3.1416 y muéstrala en pantalla.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 9, t: "9. Unir Textos (Concatenación)", instr: "Crea 'saludo' = \"Hola\" y 'nombre' = \"Ana\". Únelas con un espacio y printéalas.", code: "saludo = \"Hola\"\nnombre = \"Ana\"\n\n# Escribe tu código aquí abajo:\n" },
            { id: 10, t: "10. Intercambio de Valores", instr: "Intercambia los valores de x = 5 y y = 10 usando asignación múltiple (x, y = y, x) e imprime ambos.", code: "x = 5\ny = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 11, t: "11. Cálculo de Área con Variables", instr: "Define base = 5 y altura = 10. Calcula el área de un triángulo (base * altura / 2) y guárdala en una variable.", code: "base = 5\naltura = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 12, t: "12. Concatenación y Números", instr: "Crea una variable 'edad' con valor 22. Concatena texto convirtiéndola con str() (ej: \"Tengo \" + str(edad)).", code: "edad = 22\n\n# Escribe tu código aquí abajo:\n" },
            { id: 13, t: "13. Incremento Acumulativo", instr: "Crea 'vidas' = 3. Resta 1 vida usando el operador de asignación (-= 1) e imprímela.", code: "vidas = 3\n\n# Escribe tu código aquí abajo:\n" },
            { id: 14, t: "14. Constante de Configuración", instr: "Define una constante 'MAX_INTENTOS = 5' e imprímela junto a un texto descriptivo.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 15, t: "15. Cálculo de Propina con Variables", instr: "Crea subtotal = 50.0 y porcentaje = 0.15. Calcula la propina total e imprímela.", code: "subtotal = 50.0\nporcentaje = 0.15\n\n# Escribe tu código aquí abajo:\n" },
            { id: 16, t: "16. Promedio de Tres Notas", instr: "Crea tres variables con calificaciones (n1, n2, n3), saca su promedio y muéstralo.", code: "n1 = 14\nn2 = 18\nn3 = 16\n\n# Escribe tu código aquí abajo:\n" },
            { id: 17, t: "17. Conversión de Temperatura", instr: "Crea una variable con celsius = 25. Conviértela a Fahrenheit usando la fórmula F = C * 9/5 + 32.", code: "celsius = 25\n\n# Escribe tu código aquí abajo:\n" },
            { id: 18, t: "18. Múltiples Variables en Línea", instr: "Asigna en una sola línea x, y, z = 1, 2, 3 e imprime la suma de las tres.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 19, t: "19. Uso de F-Strings", instr: "Crea nombre = \"Luis\" y edad = 30. Imprime usando una f-string: f\"Hola, soy {nombre} y tengo {edad} años.\"", code: "nombre = \"Luis\"\nedad = 30\n\n# Escribe tu código aquí abajo:\n" },
            { id: 20, t: "20. Cálculo de Descuento", instr: "Precio original = 200, descuento = 0.20 (20%). Calcula el precio final e imprímilo.", code: "precio = 200\ndescuento = 0.20\n\n# Escribe tu código aquí abajo:\n" },
            { id: 21, t: "21. Constante de Gravedad", instr: "Define GRAVEDAD = 9.81 y masa = 10. Calcula el peso (masa * GRAVEDAD) e imprímilo.", code: "GRAVEDAD = 9.81\nmasa = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 22, t: "22. Ver el Tipo de Dato", instr: "Crea una variable con valor 42 y usa print(type(mi_variable)) para ver su tipo.", code: "valor = 42\n\n# Escribe tu código aquí abajo:\n" },
            { id: 23, t: "23. Operador Módulo (%)", instr: "Crea numero = 17 y divisor = 3. Halla el residuo usando el operador % e imprímelo.", code: "numero = 17\ndivisor = 3\n\n# Escribe tu código aquí abajo:\n" },
            { id: 24, t: "24. Potencia con Variables", instr: "Crea base = 2 y exponente = 3. Calcula la potencia usando ** e imprímela.", code: "base = 2\nexponente = 3\n\n# Escribe tu código aquí abajo:\n" },
            { id: 25, t: "25. Segundos en un Día", instr: "Define constantes HORA_A_MIN = 60 y MIN_A_SEG = 60. Calcula cuántos segundos hay en un día (24 horas).", code: "HORA_A_MIN = 60\nMIN_A_SEG = 60\n\n# Escribe tu código aquí abajo:\n" },
            { id: 26, t: "26. Constantes de IVA", instr: "Define IVA = 0.12 y producto = 100. Calcula el valor total con IVA incluido.", code: "IVA = 0.12\nproducto = 100\n\n# Escribe tu código aquí abajo:\n" },
            { id: 27, t: "27. Asignación Combinada (*=)", instr: "Crea puntaje = 10. Multiplícalo por 5 usando el operador *= e imprime el resultado.", code: "puntaje = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 28, t: "28. Métodos de Texto en Variables", instr: "Crea nombre = \"maria\" y apellido = \"gomez\". Imprímelos capitalizados usando .capitalize().", code: "nombre = \"maria\"\napellido = \"gomez\"\n\n# Escribe tu código aquí abajo:\n" },
            { id: 29, t: "29. Validación Lógica", instr: "Crea es_mayor = True y tiene_permiso = False. Evalúa si ambas son verdaderas con 'and' y muéstralo.", code: "es_mayor = True\ntiene_permiso = False\n\n# Escribe tu código aquí abajo:\n" },
            { id: 30, t: "30. Proyecto Final: Factura", instr: "Define variables para producto, cantidad, precio unitario y calcula el total imprimiendo un resumen.", code: "producto = \"Laptop\"\ncantidad = 2\nprecio_unitario = 450.0\n\n# Escribe tu código aquí abajo:\n" }
        ];

        let editor;
        const urlBackend = "/ejecutar";

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: ejercicios[0].code,
                language: 'python',
                theme: 'vs-dark',
                lineNumbers: 'on',
                automaticLayout: true,
                insertSpaces: true,
                tabSize: 4,
                trimAutoWhitespace: true
            });
            document.getElementById('texto-instruccion').innerText = ejercicios[0].instr;
            document.getElementById('title').innerText = ejercicios[0].t;
        });

        const listContainer = document.getElementById('lista');
        ejercicios.forEach((ej, index) => {
            const d = document.createElement('div');
            d.className = `item ${index === 0 ? 'active' : ''}`;
            d.innerText = ej.t;
            d.onclick = () => {
                document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                d.classList.add('active');
                document.getElementById('title').innerText = ej.t;
                document.getElementById('texto-instruccion').innerText = ej.instr;
                
                document.getElementById('consola').innerText = "";
                document.getElementById('ia').innerHTML = "";
                
                editor.setValue(ej.code);
            };
            listContainer.appendChild(d);
        });

        async function ejecutar() {
            const consoleEl = document.getElementById('consola');
            const iaEl = document.getElementById('ia');
            consoleEl.innerText = "Ejecutando...";
            iaEl.innerHTML = "";

            try {
                const res = await fetch(urlBackend, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ codigo: editor.getValue() })
                });

                const data = await res.json();

                if (data.mensaje_alerta) {
                    consoleEl.innerText = "(Sin salida)";
                    iaEl.innerHTML = `<div class="alerta-box"><strong>⚠️ Atención:</strong><br>${data.mensaje_alerta}</div>`;
                    return;
                }

                consoleEl.innerText = data.salida || "Sin salida de consola";

                if (data.exito && data.mensaje) {
                    iaEl.innerHTML = `<div class="exito-box"><strong>🎉 Mensaje:</strong><br>${data.mensaje}</div>`;
                } else if (!data.exito && data.explicacion_ia) {
                    iaEl.innerHTML = `<div class="ia-box"><strong>🤖 Tutor IA:</strong><br>${data.explicacion_ia}</div>`;
                }
            } catch (e) {
                consoleEl.innerText = "Error conectando al servidor backend.";
            }
        }
    </script>
</body>
</html>
