<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios Variables y Constantes - Python</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        select { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc; }
        .instruction { background: #e8f4fd; padding: 15px; border-left: 5px solid #3498db; margin-bottom: 20px; border-radius: 4px; }
        textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #219653; }
        .output-box { margin-top: 20px; background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; }
        .ai-box { margin-top: 15px; background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
<div class="container">
    <h1>🐍 Ejercicios Variables y Constantes</h1>
    
    <label for="selector"><strong>Selecciona un ejercicio:</strong></label>
    <select id="selector" onchange="cargarEjercicio()"></select>

    <div class="instruction" id="enunciado">Selecciona un ejercicio arriba para comenzar.</div>

    <textarea id="editor"></textarea>
    <br>
    <button onclick="ejecutarCodigo()">Ejecutar Código</button>

    <h3>Consola:</h3>
    <div class="output-box" id="salida">(Esperando ejecución...)</div>

    <div id="contenedor-ia" style="display:none;">
        <h3>🤖 Tutor IA:</h3>
        <div class="ai-box" id="explicacion-ia"></div>
    </div>
</div>

<script>
const ejercicios = [
    {titulo: "1. Declarar una variable numérica", desc: "Crea una variable llamada 'edad' y asígnale el valor 25. Luego imprímela.", codigo: "# Escribe tu código aquí abajo:\nedad = 25\nprint(edad)"},
    {titulo: "2. Variable de tipo texto (String)", desc: "Crea una variable llamada 'nombre' con tu nombre e imprímela.", codigo: "# Escribe tu código aquí abajo:\nnombre = \"Carlos\"\nprint(nombre)"},
    {titulo: "3. Actualizar el valor de una variable", desc: "Crea una variable 'puntos' con valor 10, súmale 5 e imprime el resultado final.", codigo: "# Escribe tu código aquí abajo:\npuntos = 10\npuntos = puntos + 5\nprint(puntos)"},
    {titulo: "4. Constante por convención", desc: "Crea una constante llamada 'PI' con valor 3.1416 e imprímela.", codigo: "# Escribe tu código aquí abajo:\nPI = 3.1416\nprint(PI)"},
    {titulo: "5. Suma de dos variables", desc: "Crea dos variables numéricas 'a = 12' y 'b = 8', súmalas e imprime el resultado.", codigo: "# Escribe tu código aquí abajo:\na = 12\nb = 8\nprint(a + b)"},
    {titulo: "6. Asignación múltiple", desc: "Asigna en una sola línea x = 5, y = 10 e imprime la suma de ambos.", codigo: "# Escribe tu código aquí abajo:\nx, y = 5, 10\nprint(x + y)"},
    {titulo: "7. Constante de configuración de velocidad", desc: "Crea una constante 'MAX_VELOCIDAD = 120' y muéstrala en pantalla.", codigo: "# Escribe tu código aquí abajo:\nMAX_VELOCIDAD = 120\nprint(MAX_VELOCIDAD)"},
    {titulo: "8. Concatenación de texto", desc: "Crea 'saludo = \"Hola\"' y 'persona = \"Ana\"'. Imprímelos unidos con un espacio.", codigo: "# Escribe tu código aquí abajo:\nsaludo = \"Hola\"\npersona = \"Ana\"\nprint(saludo + \" \" + persona)"},
    {titulo: "9. Variable booleana", desc: "Crea una variable 'es_activo' con valor True e imprímela.", codigo: "# Escribe tu código aquí abajo:\nes_activo = True\nprint(es_activo)"},
    {titulo: "10. Cálculo de área de un rectángulo", desc: "Define constantes 'BASE = 10' y 'ALTURA = 5'. Calcula e imprime el área.", codigo: "# Escribe tu código aquí abajo:\nBASE = 10\nALTURA = 5\narea = BASE * ALTURA\nprint(area)"},
    {titulo: "11. Tipo de dato con type()", desc: "Crea una variable 'precio = 19.99' e imprime su tipo usando type(precio).", codigo: "# Escribe tu código aquí abajo:\nprecio = 19.99\nprint(type(precio))"},
    {titulo: "12. Intercambio de valores (Swapping)", desc: "Dado a = 1 y b = 2, intercambia sus valores e imprime 'a' y 'b'.", codigo: "# Escribe tu código aquí abajo:\na = 1\nb = 2\na, b = b, a\nprint(a)\nprint(b)"},
    {titulo: "13. Uso de f-strings básico", desc: "Crea 'producto = \"Laptop\"' y 'precio = 800'. Imprime: 'El precio de la Laptop es 800'.", codigo: "# Escribe tu código aquí abajo:\nproducto = \"Laptop\"\nprecio = 800\nprint(f\"El precio de la {producto} es {precio}\")"},
    {titulo: "14. Constante de días de la semana", desc: "Crea una constante 'DIAS_SEMANA = 7' y multiplícala por 4 para obtener semanas.", codigo: "# Escribe tu código aquí abajo:\nDIAS_SEMANA = 7\nprint(DIAS_SEMANA * 4)"},
    {titulo: "15. Conversión de texto a entero (Casting)", desc: "Crea una variable texto 'numero_str = \"50\"', conviértela a int y súmale 10.", codigo: "# Escribe tu código aquí abajo:\nnumero_str = \"50\"\nresultado = int(numero_str) + 10\nprint(resultado)"},
    {titulo: "16. Variables decimales (Float)", desc: "Crea 'temperatura = 23.5' y réstale 2.0. Imprime el resultado.", codigo: "# Escribe tu código aquí abajo:\ntemperatura = 23.5\ntemperatura = temperatura - 2.0\nprint(temperatura)"},
    {titulo: "17. Constante de IVA", desc: "Crea una constante 'IVA = 0.16' y calcula el impuesto de un producto que cuesta 200.", codigo: "# Escribe tu código aquí abajo:\nIVA = 0.16\nprecio = 200\nprint(precio * IVA)"},
    {titulo: "18. Operador módulo con variables", desc: "Crea 'numero = 17' y usa el operador % 2 para ver su residuo.", codigo: "# Escribe tu código aquí abajo:\nnumero = 17\nprint(numero % 2)"},
    {titulo: "19. Longitud de un string almacenado", desc: "Crea una variable 'palabra = \"Programacion\"' e imprime su longitud con len().", codigo: "# Escribe tu código aquí abajo:\npalabra = \"Programacion\"\nprint(len(palabra))"},
    {titulo: "20. Nombre completo uniendo variables", desc: "Crea 'nombre = \"Lucía\"', 'apellido = \"Gómez\"' e imprímelos juntos formateados.", codigo: "# Escribe tu código aquí abajo:\nnombre = \"Lucía\"\napellido = \"Gómez\"\nprint(f\"{nombre} {apellido}\")"},
    {titulo: "21. Constante de segundos en una hora", desc: "Define constantes 'MINUTOS_HORA = 60' y 'SEGUNDOS_MINUTO = 60'. Imprime cuántos segundos tiene una hora.", codigo: "# Escribe tu código aquí abajo:\nMINUTOS_HORA = 60\nSEGUNDOS_MINUTO = 60\nprint(MINUTOS_HORA * SEGUNDOS_MINUTO)"},
    {titulo: "22. Reasignación con operador abreviado", desc: "Crea 'saldo = 100' y asígnale saldo += 50 usando el operador abreviado. Imprímelo.", codigo: "# Escribe tu código aquí abajo:\nsaldo = 100\nsaldo += 50\nprint(saldo)"},
    {titulo: "23. Variables nulas o None", desc: "Crea una variable 'resultado_busqueda = None' e imprímela.", codigo: "# Escribe tu código aquí abajo:\nresultado_busqueda = None\nprint(resultado_busqueda)"},
    {titulo: "24. Conversión a string", desc: "Crea una variable numérica 'anio = 2026', conviértela a texto y concaténala con un mensaje.", codigo: "# Escribe tu código aquí abajo:\nanio = 2026\nprint(\"Estamos en el año \" + str(anio))"},
    {titulo: "25. Constante de gravedad", desc: "Crea una constante 'GRAVEDAD = 9.8' y calcula el peso de un objeto de masa 10 (Fuerza = masa * gravedad).", codigo: "# Escribe tu código aquí abajo:\nGRAVEDAD = 9.8\nmasa = 10\nprint(masa * GRAVEDAD)"},
    {titulo: "26. Potenciación con variables", desc: "Crea una variable 'base = 2' y elevala al cubo (**) usando variables. Imprime el resultado.", codigo: "# Escribe tu código aquí abajo:\nbase = 2\nprint(base ** 3)"},
    {titulo: "27. Dividir y obtener entero (Floor Division)", desc: "Crea 'total_manzanas = 13' y divídelas entre 4 personas usando división entera (//). Imprime cuántas le toca a cada uno.", codigo: "# Escribe tu código aquí abajo:\ntotal_manzanas = 13\nprint(total_manzanas // 4)"},
    {titulo: "28. Constante de nombre de aplicación", desc: "Define una constante 'APP_NOMBRE = \"MiSistemaPython\"' y 'APP_VERSION = 1.0'. Imprímelos juntos.", codigo: "# Escribe tu código aquí abajo:\nAPP_NOMBRE = \"MiSistemaPython\"\nAPP_VERSION = 1.0\nprint(f\"{APP_NOMBRE} v{APP_VERSION}\")"},
    {titulo: "29. Conversión de mayúsculas en string", desc: "Crea una variable 'curso = \"python básico\"' y usa el método .upper() para imprimirla.", codigo: "# Escribe tu código aquí abajo:\ncurso = \"python básico\"\nprint(curso.upper())"},
    {titulo: "30. Cálculo de promedio final", desc: "Crea tres variables con calificaciones: 'n1 = 85', 'n2 = 90', 'n3 = 95'. Calcula e imprime su promedio.", codigo: "# Escribe tu código aquí abajo:\nn1 = 85\nn2 = 90\nn3 = 95\npromedio = (n1 + n2 + n3) / 3\nprint(promedio)"}
];

function inicializar() {
    const selector = document.getElementById('selector');
    ejercicios.forEach((ej, index) => {
        let opt = document.createElement('option');
        opt.value = index;
        opt.textContent = ej.titulo;
        selector.appendChild(opt);
    });
    cargarEjercicio();
}

function cargarEjercicio() {
    const idx = document.getElementById('selector').value;
    document.getElementById('enunciado').innerHTML = `<strong>Enunciado:</strong> ${ejercicios[idx].desc}`;
    document.getElementById('editor').value = ejercicios[idx].codigo;
    document.getElementById('salida').innerText = "(Esperando ejecución...)";
    document.getElementById('contenedor-ia').style.display = "none";
}

async function ejecutarCodigo() {
    const codigo = document.getElementById('editor').value;
    const salidaDiv = document.getElementById('salida');
    const iaDiv = document.getElementById('explicacion-ia');
    const contenedorIa = document.getElementById('contenedor-ia');

    salidaDiv.innerText = "Ejecutando...";
    contenedorIa.style.display = "none";

    try {
        const response = await fetch('/ejecutar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigo: codigo })
        });
        const data = await response.json();

        salidaDiv.innerText = data.salida;

        if (data.explicacion_ia) {
            iaDiv.innerText = data.explicacion_ia;
            contenedorIa.style.display = "block";
        }
    } catch (err) {
        salidaDiv.innerText = "Error de red al conectar con el servidor.";
    }
}

window.onload = inicializar;
</script>
</body>
</html>
